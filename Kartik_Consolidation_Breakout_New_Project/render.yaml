services:
  - type: web
    name: kartik-algo
    runtime: python
    plan: free
    rootDir: Kartik_Consolidation_Breakout_New_Project
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
